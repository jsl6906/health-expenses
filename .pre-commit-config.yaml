# Pre-commit hooks configuration for Personal Expenses Application (Windows)
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Docker image build hook (local - Windows)
  - repo: local
    hooks:
      - id: docker-build
        name: Build Docker Image
        entry: powershell.exe -File scripts/pre-commit-docker-build.ps1
        language: system
        # Allow either forward or back slashes in path separators for Windows compatibility
        files: '(Dockerfile|pyproject\.toml|src/.*|templates/.*|static/.*|main\.py|init_db\.py|run_app\.py)$'
        # Let pre-commit pass the changed filenames to the hook so the hook can make accurate decisions
        pass_filenames: true
        always_run: false
