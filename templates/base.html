<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Health Expenses{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/app.css?v=2" rel="stylesheet">
</head>
<body>
    {% if ENV_MODE == 'TEST' %}
    <div style="background: #ffeb3b; color:#333; padding:6px 12px; text-align:center; font-weight:600; font-size:0.95rem; border-bottom:2px solid #e0c200;">
        TEST ENVIRONMENT - DATA IS NON-PRODUCTION
    </div>
    {% endif %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Health Expenses
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/family_members">Family Members</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/providers">Providers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/insurance">Insurance</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link charges-with-defaults" href="/charges">Charges</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/payments">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/premiums">Premiums</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Ensure main Charges links include the default 6-month date range when no explicit range is present.
    // This keeps the charges page logic simple: the page will only honor URL params and will not set its own defaults.
    (function() {
        try {
            const today = new Date();
            const to = today.toISOString().slice(0,10);
            const six = new Date();
            six.setMonth(six.getMonth() - 6);
            const from = six.toISOString().slice(0,10);

            const anchors = document.querySelectorAll('a.charges-with-defaults');
            anchors.forEach(a => {
                try {
                    // Build a URL using the page origin so searchParams works for relative paths
                    const url = new URL(a.getAttribute('href'), window.location.origin);
                    // Only add defaults if neither from nor to present
                    if (!url.searchParams.has('from') && !url.searchParams.has('to')) {
                        url.searchParams.set('from', from);
                        url.searchParams.set('to', to);
                        // Preserve only path + query (relative)
                        a.href = url.pathname + url.search;
                    }
                } catch (e) {
                    // ignore malformed hrefs
                }
            });
        } catch (e) {
            // non-fatal
            console && console.error && console.error('charges default link setup failed', e);
        }
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
