<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Health Expenses{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/app.css?v=2" rel="stylesheet">
</head>
<body>
    {% if ENV_MODE == 'TEST' %}
    <div style="background: #ffeb3b; color:#333; padding:6px 12px; text-align:center; font-weight:600; font-size:0.95rem; border-bottom:2px solid #e0c200;">
        TEST ENVIRONMENT - DATA IS NON-PRODUCTION
    </div>
    {% endif %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> Health Expenses
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/providers">Providers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/charges">Charges</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/payments">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/premiums">Premiums</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
