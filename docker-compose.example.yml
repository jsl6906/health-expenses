# Docker Compose example for Personal Expenses Application
# Copy this file to docker-compose.yml and customize the environment variables

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: personal-expenses-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_expenses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - personal-expenses-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Personal Expenses Application
  app:
    image: personal-expenses:latest
    container_name: personal-expenses-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: personal_expenses
      DB_USER: postgres
      DB_PASSWORD: your_secure_password_here

      # Application Configuration
      ENV_MODE: PROD
      DB_ECHO: "false"

      # Optional: LLM Configuration (for EOB parsing)
      # GOOGLE_API_KEY: your_gemini_api_key_here

      # Security (generate secure random values)
      # SECRET_KEY: your_secret_key_here

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personal-expenses-net
    volumes:
      # Optional: Mount for file uploads/attachments
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: personal-expenses-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_here
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - personal-expenses-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  pgadmin_data:
    driver: local

networks:
  personal-expenses-net:
    driver: bridge
