# Docker Compose example for Personal Expenses Application
#
# SETUP INSTRUCTIONS:
# 1. Copy this file: cp docker-compose.example.yml docker-compose.yml
# 2. Copy environment file: cp .env.docker.example .env
# 3. Edit .env file to set your database connection and configuration
# 4. Run: docker-compose up -d
#
# NOTE: This setup assumes you have an external PostgreSQL database
# SECURITY: Never commit your .env file to version control!
#

version: '3.8'

services:
  # Personal Expenses Application
  app:
    image: personal-expenses:latest
    container_name: personal-expenses-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      # Database Configuration (External Database)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-personal_expenses}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}

      # Application Configuration
      ENV_MODE: PROD  # Force PROD mode for Docker to use Azure database
      DB_ECHO: ${DB_ECHO:-false}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      APP_DEBUG: ${APP_DEBUG:-false}

      # LLM Configuration (for EOB parsing)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      EOB_DEBUG_PREVIEW: ${EOB_DEBUG_PREVIEW:-false}
      EOB_USE_FILE_UPLOAD: ${EOB_USE_FILE_UPLOAD:-true}

      # Claim email (SMTP) Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      CLAIM_EMAIL_TO: ${CLAIM_EMAIL_TO:-}
      CLAIM_EMAIL_CC: ${CLAIM_EMAIL_CC:-}
      CLAIM_EMAIL_BCC: ${CLAIM_EMAIL_BCC:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional one-shot migrator service to apply Alembic migrations.
  # Usage: docker-compose run --rm migrator
  migrator:
    image: personal-expenses:latest
    command: ["sh", "-c", "uv run alembic upgrade head"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-personal_expenses}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: "no"
